; Cardputer-Adv 固件（ESP32-S3FN8，8MB Flash，无 PSRAM，240×135 ST7789V2）
;
; 只在 Mac 上装 PlatformIO 后编译：
;   cd firmware && pio run                  # 编译
;   cd firmware && pio run -t upload        # USB 烧录（按住 G0 再插线进下载模式）
;
; 说明：
; * board 用 esp32-s3-devkitc-1（Cardputer-Adv 官方板级定义在 platform-m5stack 里，
;   若本机装了它，把 board 换成 m5stack-cardputer-adv 即可，引脚由 M5Cardputer 库自己接管）。
; * -DM5GFX_BOARD=24 是社区实测的修正：M5GFX 会把 ADV 误判成 StampS3。
[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 这块板子的 USB CDC 在 esptool 的 stub 阶段会丢包（"No serial data received"），
; 用 ROM 加载器（--no-stub）反而稳定；速度降到 460800 也够快、更稳。
upload_speed = 460800
upload_flags = --no-stub
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DM5GFX_BOARD=24
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5Unified@^0.2.2
    links2004/WebSockets@^2.4.1
build_unflags = -std=gnu++11

; Wi-Fi 刷机（不用插线）：HR_TOKEN=$(cat ~/.hermes-remote/device.token) pio run -e ota -t upload
[env:ota]
extends = env:cardputer-adv
upload_protocol = espota
upload_port = ${sysenv.HR_IP}
upload_flags = --auth=${sysenv.HR_TOKEN}
